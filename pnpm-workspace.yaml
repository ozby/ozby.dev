packages:
  - "."
  - "apps/*"
  - "infra"

catalog:
  "@webpresso/app-config": "0.5.0"
  "@ozby/cloudflare": ^0.1.0
  "@types/node": ^22.19.21
  "@stryker-mutator/core": ^9.6.1
  "@stryker-mutator/vitest-runner": ^9.6.1
  "@stryker-mutator/typescript-checker": ^9.6.1
  "typescript": ^7.0.2
  "vitest": ^4.1.8

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  tldjs: true
  workerd: true

cleanupUnusedCatalogs: true

# Stryker core bare-imports `typescript` (undeclared) for its sandbox tsconfig
# preprocessor; under this repo's TypeScript 7 that import lacks
# ts.parseConfigFileTextToJson and every mutation run dies at startup. Inject the
# TS6 compiler-API bridge as core's own dependency so only stryker sees it.
packageExtensions:
  "@stryker-mutator/core":
    dependencies:
      typescript: npm:@typescript/typescript6@^6.0.2
